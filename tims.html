<!DOCTYPE html>
<html lang="en">
<style>
    :root {
        --bg-color: #FAF3DD;
        --other-color: #C8D5B9;
        --heading-color: #8FC0A9;
    }
    h1 {
        color: var(--heading-color);
    }
    .nav {
        list-style-type: none; /* removes bullet points */
        margin: 0;
        padding: 0;
        display: flex;
        background-color: var(--other-color);
        overflow: hidden;
    }
    ul.nav li {
        float: left;
    }
    ul.nav li a {
    color: black;
    text-decoration: none; /*removes underline*/
    padding: 14px 20px; 
    display: block;
    transition: 0.7s;
    }
    ul.nav a:hover {
    background-color: var(--heading-color);
    color: var(--other-color);
    font-weight: bold;
    }
    body {
        background-color: var(--bg-color);
    }
    .grid-container {
        display: grid;
        gap: 10px;
        grid-template-columns: auto auto auto auto auto auto auto auto auto auto auto auto;
    }
    .grid-item {
        text-align: center;
        background-color: var(--bg-color);
    }
    .title {
        grid-row: 1;
        grid-column: 1 / span 12;
    }
    .navbar {
        grid-row: 2;
        grid-column: 1 / span 12;
    }
    .front-image {
        grid-row: 3 / span 3;
        grid-column: 7 / span 6;
        padding: 30px;
    }
    .back-image {
        grid-row: 6 / span 3;
        grid-column: 7 / span 6;
        padding: 30px;
    }
    .nutrition-facts {
        grid-row: 3 / span 3;
        grid-column: 1 / span 6;
        padding: 30px;
    }
    .main-content-1 {
        grid-row: 6;
        grid-column: 1 / span 6;
    }
    .reason-1 {
        grid-row: 7;
        grid-column: 1 / span 3;
    }
    .reason-2 {
        grid-row: 7;
        grid-column: 4 / span 3;
    }
    .main-content-2 {
        grid-row: 8;
        grid-column: 1 / span 6;
    }
    .footer {
        position: fixed;
        left: 0;
        bottom: 0;
        height: 50px;
        width: 100%;
        background-color: var(--other-color);
        color: black;
        text-align: center;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim's Jalapeño Chips</title>
    <link rel="stylesheet" href="ForMyPages.css">
</head>
<body>
    <div class="grid-container">
        <div class="grid-item navbar">
            <ul class="nav">
                <li><a href="doritos.html">Dorito's Nacho Cheese Tortilla Chips</a></li>
            </ul>
        </div>
        <div class="title grid-item">
            <h1>Tim's Jalapeño Chips</h1>
        </div>
        <div class="front-image grid-item">
            <img src="PlaceholderMAGroupTemporary.png">
        </div>
        <div class="back-image grid-item">
            <img src="PlaceholderMAGroupTemporary.png">
        </div>
        <div class="nutrition-facts grid-item">
            <h2>Nutrition Facts</h2>
        </div>
        <div class="main-content-1 grid-item">
            <h2>Two reasons why I enjoy this snack</h2>
        </div>
        <div class="reason-1 grid-item">
            <h5>Reason 1</h5>
        </div>
        <div class="reason-2 grid-item">
            <h5>Reason 2</h5>
        </div>
        <div class="main-content-2 grid-item">
            <h2>Conclusion</h2>
        </div>
        <div class="footer">
            <p>Shaunak Sailer</p>
        </div>
    </div>
</body>
</html>
